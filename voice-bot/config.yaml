greeting_inbound: Hi, how can I help you?
greeting_outbound: Hi, am I speaking with {customer_name}?
max_conversation_messages: 16
audio:
  sample_rate: 8000
  enable_interruptions: true
vad:
  enabled: true
  start_threshold: 0.6
  min_speech_duration: 0.25
  silence_timeout: 0.6
metrics:
  enable_metrics: true
  enable_usage_metrics: true
max_call_duration_seconds: 900
language:
  supported:
  - en
  - hi
  - te
  - ta
  default: en
  first_turn_confidence: 0.75
  # FIX: this was 1 -- meaning a single noisy/misheard turn was enough to
  # flip the TTS language mid-call. That's partly why the logs show en -> hi
  # -> en thrashing inside a few seconds; a lot of that was garbage STT
  # output (see the Deepgram fix above) getting over-trusted immediately.
  # 2 matches the hysteresis default already coded in bot.py's
  # LanguageState(...) call and requires the same language to show up twice
  # in a row before committing to a switch -- worth keeping now that STT
  # will actually be accurate, so a single mis-transcribed word can't yank
  # the conversation into a different language.
  sustained_switch_turns: 2
  initial: en
termination_processor:
  silent_patterns:
  - name: end_call_leak
    pattern: \bend[_\s-]?call\b\.?
  - name: tool_narration
    pattern: \b(call|dial|invok|trigger|activat)\w*\s+(the\s+)?(tool|function|api)\b
  - name: explicit_command
    pattern: \b(end|clos|terminat|finish|hang)\w*\s+(the\s+)?(call|conversation|session|up|tool)\b
  - name: disposition_leak
    pattern: \b(site\s+visit|inventory|lead)\s+(is\s+)?(booked|sent|partial)\b
  - name: explicit_tag
    pattern: \[hangup\]|\[end\]
  - name: transcript_recitation_leak
    pattern: \b(user|caller|assistant|system)\s*:\s*["“]
  
spoken_patterns:
  - \b(goodbye|bye|take care|alvida|dhanyavaad|shukriya)\b[\s.?!]*$
  - \bhave a (nice|great|good) (day|evening|night)\b[\s.?!]*$
  - \btalk to you (later|soon|phir milenge)\b[\s.?!]*$

turn_management:
  user_speech_timeout: 0.5
  user_turn_stop_timeout: 2.0
test_customer_name: Simran
