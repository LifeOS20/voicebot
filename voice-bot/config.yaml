# GREETINGS
greeting_inbound: "The caller just connected. Greet them warmly and briefly, then ask how you can help."
greeting_outbound: "You just called this person. Start the conversation with the opening from your campaign script."

# Max conversation messages to keep (system prompt + last N exchanges)
max_conversation_messages: 20


# AUDIO & PERFORMANCE SETTINGS
audio:
  sample_rate: 8000 # telephony audio rate for Vobiz streams
  enable_interruptions: true  # temporally disabled to debug background noise stopping the TTS!

vad:
  enabled: true
  start_threshold: 0.55 # balanced threshold so speech is detected reliably on phone audio
  min_speech_duration: 0.25 # ignore short noises (coughs, "ums", etc.)
  silence_timeout: 0.8 # How long to wait after speech stops before the bot considers the turn done and starts responding.

metrics:
  enable_metrics: true # Logs per-stage timing (which component is slow)
  enable_usage_metrics: true # Logs token/character usage for cost tracking

# TERMINATION PROCESSOR — regex patterns used by TerminationProcessor to detect call-ending phrases
termination_processor:
  # Silent Triggers: matched text is STRIPPED from output and triggers hangup silently
  silent_patterns:
    - name: "end_call_leak"
      pattern: "\\bend[_\\s-]?call\\b\\.?"
    - name: "tool_narration"
      pattern: "\\b(call|dial|invok|trigger|activat)\\w*\\s+(the\\s+)?(tool|function|api)\\b"
    - name: "explicit_command"
      pattern: "\\b(end|clos|terminat|finish|hang)\\w*\\s+(the\\s+)?(call|conversation|session|up|tool)\\b"
    - name: "disposition_leak"
      pattern: "\\b(site\\s+visit|inventory|lead)\\s+(is\\s+)?(booked|sent|partial)\\b"
    - name: "explicit_tag"
      pattern: "\\[hangup\\]|\\[end\\]"
  # Spoken Triggers: matched text is SPOKEN to caller, then triggers hangup
  spoken_patterns:
    - "\\b(goodbye|bye|good day|take care)\\b"
    - "\\bhave a (nice|great|good) (day|evening|night)\\b"
    - "\\btalk to you (later|soon)\\b"
