# ============================================================
# Production voicebot configuration
# ============================================================

active_providers:
  stt: "sarvam"
  llm: "sarvam"
  tts: "murf"

providers:

  # ------------------------------------------------------------
  # STT
  # ------------------------------------------------------------
  stt:
    sarvam:
      class_path: "pipecat.services.sarvam.stt.SarvamSTTService"
      api_key_env: "SARVAM_API_KEY"
      params:
        model: "saaras:v3"
        language: "unknown"
        mode: "codemix"
        sample_rate: 8000
        input_audio_codec: "pcm_s16le"
        keepalive_timeout: 10
        keepalive_interval: 5

    deepgram:
      class_path: "pipecat.services.deepgram.stt.DeepgramSTTService"
      api_key_env: "DEEPGRAM_API_KEY"
      params:
        model: "nova-2"
        language: "en"
        smart_format: true
        sample_rate: 8000
        encoding: "linear16"
        channels: 1

    openai:
      class_path: "pipecat.services.openai.stt.OpenAISTTService"
      api_key_env: "OPENAI_API_KEY"
      params:
        model: "whisper-1"

  # ------------------------------------------------------------
  # LLM
  # ------------------------------------------------------------
  llm:
    sarvam:
      class_path: "pipecat.services.openai.llm.OpenAILLMService"
      api_key_env: "SARVAM_API_KEY"
      params:
        model: "sarvam-105b-conversations"
        base_url: "https://api.sarvam.ai/v1"
        temperature: 0.2
        max_completion_tokens: 160
        tools: &llm_tools
          - type: "function"
            function:
              name: "end_call"
              description: "End the call when the conversation is complete, the caller is not interested, or the caller clearly wants to end the call."
              parameters:
                type: "object"
                properties: {}
                additionalProperties: false

          - type: "function"
            function:
              name: "set_conversation_language"
              description: "Change the language spoken by the agent. Use only when the caller explicitly requests another supported language or clearly changes their conversational language. Do not use this for ordinary code-switching or isolated words."
              parameters:
                type: "object"
                properties:
                  language:
                    type: "string"
                    enum: ["en", "hi", "te"]
                  reason:
                    type: "string"
                required: ["language", "reason"]
                additionalProperties: false

    groq:
      class_path: "pipecat.services.openai.llm.OpenAILLMService"
      api_key_env: "GROQ_API_KEY"
      params:
        model: "llama-3.1-8b-instant"
        base_url: "https://api.groq.com/openai/v1"
        temperature: 0.2
        max_completion_tokens: 160
        tools: *llm_tools

    cerebras:
      class_path: "pipecat.services.openai.llm.OpenAILLMService"
      api_key_env: "CEREBRAS_API_KEY"
      params:
        model: "gpt-oss-120b"
        base_url: "https://api.cerebras.ai/v1"
        temperature: 0.2
        max_completion_tokens: 160
        # FIXED: cerebras previously had no tools entry at all. If you ever
        # failed over to it (deliberately, or automatically in a future
        # failover implementation), the LLM would silently lose access to
        # end_call and set_conversation_language — no error, just the whole
        # termination/language architecture disappearing, leaving only the
        # regex safety net. Same shared anchor as sarvam/groq now, so this
        # can't drift out of sync again.
        tools: *llm_tools

  # ------------------------------------------------------------
  # TTS
  # ------------------------------------------------------------
  tts:
    murf:
      class_path: "services.murf_http.MurfFalcon2TTSService"
      api_key_env: "MURF_API_KEY"
      _needs_aiohttp: true
      params:
        model: "falcon-2"
        voice_id: "Anisha"
        locale: "en-IN"
        base_url: "https://in.api.murf.ai"
        sample_rate: 8000
        channel_type: "MONO"
        format: "PCM"
        request_timeout_seconds: 30

    sarvam:
      class_path: "pipecat.services.sarvam.tts.SarvamTTSService"
      api_key_env: "SARVAM_API_KEY"
      params:
        model: "bulbul:v3"
        voice_id: "anushka"
        language: "en-IN"
        sample_rate: 8000

    elevenlabs:
      class_path: "services.elevenlabs_http.HttpElevenLabsTTSService"
      api_key_env: "ELEVENLABS_API_KEY"
      params:
        voice_id: "REPLACE_WITH_TESTED_MULTILINGUAL_VOICE"

    deepgram:
      class_path: "pipecat.services.deepgram.tts.DeepgramTTSService"
      api_key_env: "DEEPGRAM_API_KEY"
      params:
        voice: "aura-asteria-en"

# ------------------------------------------------------------
# Prompt layers
# ------------------------------------------------------------

voice_rules: |
  You are on a live phone call. Your response is spoken through TTS.
  Keep ordinary responses to 1–2 short sentences.
  Use natural spoken language. Never use markdown or lists.
  Speak numbers, dates, currency, names and abbreviations naturally.
  Stop speaking when interrupted.
  Do not guess or fabricate.
  Never change the customer's name unless they explicitly state it.
  Do not narrate internal tools, system state, language detection, or actions.

termination_rules: |
  TERMINATION:
  - When the conversation is complete, give a brief goodbye and call end_call.
  - If the user is not interested, acknowledge briefly, say goodbye and call end_call.
  - If the user clearly wants to end the call, say goodbye and call end_call.
  - Never speak the tool name.
  - Never narrate internal actions.

real_estate_sales_script: &default_sales_script |
  SYSTEM ROLE
  You are Rakesh from Prestige Group.
  You are calling {customer_name} regarding Prestige Green Meadows in Whitefield, Bangalore.

  This is a real outbound sales call. Be natural, concise and conversational.

  GOAL
  Inform the caller about the property, understand whether it is relevant,
  create genuine interest, and move toward sharing details or arranging a site visit.
  Do not pressure the caller.

  OPENING
  Start in English:
  "Hi… am I speaking with {customer_name}?"
  Stop and listen.

  LANGUAGE
  The application maintains the current conversational language for this call.
  Supported languages are English, Hindi and Telugu.

  The opening is English.

  After the caller responds, speak primarily in the caller's current language.
  Natural code-switching is normal. Hindi and Telugu conversations may naturally
  contain English real-estate terms such as property, apartment, Whitefield,
  site visit, loan, price and BHK.

  Do not switch languages because of one isolated word, a name, brand, location,
  "sir", "ji", "okay", or another common borrowed word.

  When the caller explicitly requests another supported language, use the
  set_conversation_language tool before continuing.

  When the caller clearly and consistently changes language across multiple turns,
  follow the change naturally. Do not announce the switch.

  Do not translate natural code-mixed speech unnecessarily.

  CORE BEHAVIOUR
  Listen → acknowledge briefly → answer → move the conversation forward.
  Do not dump property information.
  Ask only questions useful to the current conversation.

  ACKNOWLEDGEMENTS
  Use short acknowledgements occasionally:
  "okay…", "right…", "hmm… got it…", "sure…"
  Do not use a filler in every response.

  PROPERTY INFORMATION
  Property: Prestige Green Meadows, Whitefield, Bangalore
  Configurations: 2 BHK and 3 BHK apartments
  Indicative price: approximately ₹95 lakh to ₹1.8 crore depending on configuration
  Possession: under construction, target Q4 2027
  Key amenities: covered parking, 24/7 security, clubhouse, swimming pool, kids' play area
  Location: approximately 10 minutes from Whitefield Metro, approximately 15 minutes
  from ORR, schools and hospitals within approximately 3 km

  Never present indicative information as a guaranteed quote.
  If exact information is unavailable, say exact pricing depends on the unit.

  CONVERSATION
  If interested, explain only what is relevant to the question.
  If the caller already owns a property or is not actively looking, acknowledge
  and briefly explain that details may still be useful for future reference.
  If they hesitate, keep it low pressure.
  If they want details, offer to share them.
  If they want a site visit, confirm the next step.
  Do not invent availability, discounts, urgency, inventory or booking status.

base_prompt: *default_sales_script
campaign_prompt: *default_sales_script

greeting_inbound: "The caller just connected. Greet them briefly and ask how you can help."
greeting_outbound: "You just called this person. Start with the opening from the campaign script."

max_conversation_messages: 20

# ------------------------------------------------------------
# Audio / VAD / metrics
# ------------------------------------------------------------

audio:
  sample_rate: 8000
  enable_interruptions: true

vad:
  enabled: true
  start_threshold: 0.55
  min_speech_duration: 0.25
  silence_timeout: 0.8

metrics:
  enable_metrics: true
  enable_usage_metrics: true

max_call_duration_seconds: 900

# ------------------------------------------------------------
# Language controller
# ------------------------------------------------------------

language:
  supported: ["en", "hi", "te"]
  default: "en"
  first_turn_confidence: 0.75
  sustained_switch_turns: 2

# ------------------------------------------------------------
# Termination processor
# ------------------------------------------------------------

termination_processor:
  silent_patterns:
    - name: "end_call_leak"
      pattern: "\\bend[_\\s-]?call\\b\\.?"
    - name: "tool_narration"
      pattern: "\\b(call|dial|invok|trigger|activat)\\w*\\s+(the\\s+)?(tool|function|api)\\b"
    - name: "explicit_command"
      pattern: "\\b(end|clos|terminat|finish|hang)\\w*\\s+(the\\s+)?(call|conversation|session|up|tool)\\b"
    - name: "disposition_leak"
      pattern: "\\b(site\\s+visit|inventory|lead)\\s+(is\\s+)?(booked|sent|partial)\\b"
    - name: "explicit_tag"
      pattern: "\\[hangup\\]|\\[end\\]"

  spoken_patterns:
    - "\\b(goodbye|bye|take care|alvida|dhanyavaad|shukriya)\\b[\\s.?!]*$"
    - "\\bhave a (nice|great|good) (day|evening|night)\\b[\\s.?!]*$"
    - "\\btalk to you (later|soon|phir milenge)\\b[\\s.?!]*$"